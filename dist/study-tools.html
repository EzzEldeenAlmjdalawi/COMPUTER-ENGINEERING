<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Tools – IUG Computer Engineering</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    :root {
      --bg:        #0b1f2a;
      --bg2:       #0f2a38;
      --bg3:       #163344;
      --cyan:      #00e5ff;
      --cyan-dim:  #00b8cc;
      --cyan-glow: rgba(0,229,255,0.15);
      --text:      #c8eef5;
      --text-dim:  #6fa8b8;
      --border:    rgba(0,229,255,0.18);
      --radius:    14px;
      --font-ar:   'Tajawal', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ar);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,31,42,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .nav-brand { font-family: var(--font-mono); font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-decoration: none; white-space: nowrap; }
    .nav-title  { font-size: 15px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); white-space: nowrap; }
    .nav-back   { font-size: 12px; color: var(--text-dim); text-decoration: none; border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; transition: all .2s; white-space: nowrap; }
    .nav-back:hover { color: var(--cyan); border-color: var(--cyan); }

    main { position: relative; z-index: 1; max-width: 1150px; margin: 0 auto; padding: 16px 12px 60px; }

    /* TABS */
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 50px; padding: 5px; width: fit-content; }
    .tab-btn { padding: 8px 22px; border-radius: 50px; border: none; cursor: pointer; font-family: var(--font-ar); font-size: 14px; font-weight: 600; transition: all .25s; background: transparent; color: var(--text-dim); }
    .tab-btn.active { background: var(--cyan); color: #0b1f2a; box-shadow: 0 0 20px rgba(0,229,255,0.4); }

    /* NOTEBOOK */
    .notebook-layout { display: grid; grid-template-columns: 240px 1fr; gap: 14px; min-height: 600px; }

    .subject-sidebar { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 180px); overflow-y: auto; }
    .subject-sidebar::-webkit-scrollbar { width: 4px; }
    .subject-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .year-group { margin-bottom: 4px; }
    .year-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--cyan); background: var(--cyan-glow); border: 1px solid var(--border); transition: all .18s; user-select: none; }
    .year-header:hover { background: rgba(0,229,255,0.2); }
    .year-header .arrow { font-size: 10px; transition: transform .2s; }
    .year-header.open .arrow { transform: rotate(90deg); }

    .semester-group { padding: 4px 0 0 8px; }
    .semester-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--text-dim); text-transform: uppercase; padding: 6px 8px 4px; font-family: var(--font-mono); }

    .subject-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; color: var(--text-dim); border: 1px solid transparent; display: flex; align-items: center; gap: 6px; }
    .subject-item:hover { background: var(--bg3); color: var(--text); }
    .subject-item.active { background: var(--cyan-glow); border-color: var(--border); color: var(--cyan); }
    .subject-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); flex-shrink: 0; opacity: 0; transition: opacity .2s; }
    .subject-item.has-note .dot { opacity: 1; }

    .note-area { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
    .note-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .note-subject-name { font-size: 16px; font-weight: 700; color: var(--cyan); }
    .note-actions { display: flex; gap: 8px; align-items: center; }
    .note-meta { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
    .btn-save { padding: 7px 18px; border-radius: 8px; background: var(--cyan); color: #0b1f2a; border: none; cursor: pointer; font-family: var(--font-ar); font-size: 13px; font-weight: 700; transition: all .2s; }
    .btn-save:hover { box-shadow: 0 0 16px rgba(0,229,255,0.5); }
    .btn-save.saved { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); }
    .btn-clear { padding: 7px 14px; border-radius: 8px; background: transparent; color: var(--text-dim); border: 1px solid var(--border); cursor: pointer; font-family: var(--font-ar); font-size: 13px; transition: all .2s; }
    .btn-clear:hover { border-color: #ff4444; color: #ff4444; }

    .note-toolbar { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }
    .tool-btn { width: 32px; height: 32px; border-radius: 7px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all .15s; font-weight: 700; }
    .tool-btn:hover { background: var(--cyan-glow); border-color: var(--cyan); color: var(--cyan); }

    .note-editor { flex: 1; padding: 18px; font-family: var(--font-ar); font-size: 15px; line-height: 1.9; color: var(--text); background: transparent; border: none; outline: none; resize: none; min-height: calc(100vh - 300px); }
    .note-editor::placeholder { color: var(--text-dim); }

    .note-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-dim); padding: 40px; text-align: center; }
    .note-empty .icon { font-size: 48px; opacity: .4; }

    /* ══ WHITEBOARD ══ */
    .wb-container {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column;
      /* height limited to viewport so toolbar stays visible */
      height: calc(100vh - 130px); min-height: 500px;
    }

    /* Pages bar */
    .wb-pages-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      background: var(--bg); overflow-x: auto; flex-shrink: 0;
    }
    .wb-pages-bar::-webkit-scrollbar { height: 3px; }
    .wb-pages-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .page-tab {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 8px; cursor: pointer;
      font-size: 12px; font-weight: 600; white-space: nowrap;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text-dim); transition: all .18s; flex-shrink: 0;
    }
    .page-tab:hover { color: var(--text); border-color: rgba(0,229,255,0.3); }
    .page-tab.active { background: var(--cyan-glow); border-color: var(--cyan); color: var(--cyan); }
    .page-tab .del-page {
      font-size: 10px; color: var(--text-dim); background: none; border: none;
      cursor: pointer; line-height: 1; transition: color .15s; padding: 0;
    }
    .page-tab .del-page:hover { color: #ff4444; }
    .add-page-btn {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      background: var(--bg3); border: 1px dashed var(--border);
      color: var(--cyan); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .18s;
    }
    .add-page-btn:hover { background: var(--cyan-glow); border-color: var(--cyan); }

    /* Toolbar */
    .wb-toolbar {
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
    }
    .wb-toolbar-group {
      display: flex; align-items: center; gap: 5px;
      padding-left: 8px; border-left: 1px solid var(--border);
    }
    .wb-toolbar-group:first-child { border-left: none; padding-left: 0; }
    .wb-label { font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); letter-spacing: 1px; text-transform: uppercase; }

    .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all .15s; flex-shrink: 0; }
    .color-dot.active { border-color: white; transform: scale(1.2); }

    .wb-slider { -webkit-appearance: none; width: 70px; height: 4px; background: var(--bg3); border-radius: 4px; outline: none; cursor: pointer; }
    .wb-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--cyan); cursor: pointer; }

    .wb-tool-btn {
      padding: 6px 12px; border-radius: 8px; background: var(--bg3);
      border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
      font-size: 12px; font-family: var(--font-ar); transition: all .15s; white-space: nowrap;
    }
    .wb-tool-btn:hover, .wb-tool-btn.active {
      background: var(--cyan-glow); border-color: var(--cyan); color: var(--cyan);
    }
    .wb-tool-btn.danger:hover { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.08); }

    .wb-file-label {
      padding: 6px 12px; border-radius: 8px; background: var(--bg3);
      border: 1px solid var(--border); color: var(--text-dim); cursor: pointer;
      font-size: 12px; font-family: var(--font-ar); transition: all .15s; white-space: nowrap;
    }
    .wb-file-label:hover { background: var(--cyan-glow); border-color: var(--cyan); color: var(--cyan); }

    /* Scrollable canvas wrapper — this scrolls, toolbar stays fixed */
    .wb-scroll-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      background: #0a1a24;
      background-image: radial-gradient(rgba(0,229,255,0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,229,255,0.25) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .wb-scroll-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
    .wb-scroll-wrapper::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.25); border-radius: 6px; }
    .wb-scroll-wrapper::-webkit-scrollbar-track { background: transparent; }

    /* Canvas area — sits inside the scrollable wrapper, fixed large size */
    .wb-canvas-area {
      position: relative;
      /* width fills container, height is tall so user can scroll */
      width: 100%;
      min-height: 1600px; /* tall canvas — scroll to explore */
      /* background inherited from wrapper */
    }
    .wb-canvas-area { cursor: default; }
    .wb-canvas-area.tool-pen    { cursor: crosshair; }
    .wb-canvas-area.tool-eraser { cursor: cell; }
    .wb-canvas-area.tool-line,
    .wb-canvas-area.tool-rect,
    .wb-canvas-area.tool-circle { cursor: crosshair; }
    .wb-canvas-area.tool-moveImg { cursor: grab; }
    .wb-canvas-area.tool-moveImg.dragging { cursor: grabbing; }

    /* The overlay image */
    .wb-overlay-img {
      position: absolute; top: 0; left: 0;
      transform-origin: top left;
      pointer-events: none;
      user-select: none;
      opacity: 0.92;
    }

    canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      /* touch-action set dynamically via JS based on active tool */
      touch-action: auto;
    }

    /* Zoom indicator */
    .zoom-badge {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(11,31,42,0.8); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px;
      font-size: 11px; font-family: var(--font-mono); color: var(--text-dim);
      pointer-events: none;
    }

    /* ══ RESPONSIVE ══ */

    /* Tablet (iPad) */
    @media (max-width: 900px) {
      .notebook-layout { grid-template-columns: 210px 1fr; gap: 10px; }
      .wb-toolbar { gap: 5px; }
      .wb-tool-btn { padding: 5px 9px; font-size: 11px; }
      .wb-file-label { padding: 5px 9px; font-size: 11px; }
      .wb-toolbar-group { gap: 4px; padding-left: 6px; }
      .tab-btn { padding: 7px 16px; font-size: 13px; }
    }

    /* Mobile */
    @media (max-width: 640px) {
      main { padding: 10px 8px 40px; }

      /* Tabs full width */
      .tabs { width: 100%; border-radius: 14px; }
      .tab-btn { flex: 1; text-align: center; padding: 9px 8px; font-size: 13px; border-radius: 10px; }

      /* Notebook stacked */
      .notebook-layout { grid-template-columns: 1fr; gap: 10px; min-height: unset; }
      .subject-sidebar { max-height: 220px; }
      .note-editor { min-height: 50vh; }

      /* Whiteboard full height on mobile — container clips, scroll-wrapper scrolls */
      .wb-container { height: calc(100vh - 120px); min-height: 400px; border-radius: 10px; }
      /* canvas area slightly narrower tall target on small screens */
      .wb-canvas-area { min-height: 1600px; }

      /* Toolbar scrollable on mobile */
      .wb-toolbar {
        overflow-x: auto; flex-wrap: nowrap; padding: 6px 10px;
        gap: 6px; scrollbar-width: none;
      }
      .wb-toolbar::-webkit-scrollbar { display: none; }
      .wb-toolbar-group { flex-shrink: 0; gap: 4px; padding-left: 8px; }

      .wb-tool-btn { padding: 6px 10px; font-size: 12px; flex-shrink: 0; }
      .wb-file-label { padding: 6px 10px; font-size: 12px; flex-shrink: 0; }
      .wb-label { display: none; }

      /* Pages bar compact */
      .wb-pages-bar { padding: 6px 8px; gap: 4px; }
      .page-tab { padding: 4px 10px; font-size: 11px; }
      .add-page-btn { width: 24px; height: 24px; font-size: 14px; }

      /* Nav compact */
      .nav-brand { display: none; }
      .nav-title { font-size: 14px; }

      /* Color dots slightly smaller */
      .color-dot { width: 18px; height: 18px; }

      .note-header { padding: 10px 12px; }
      .note-toolbar { padding: 6px 10px; }
      .note-subject-name { font-size: 14px; }
    }

    /* Very small phones */
    @media (max-width: 380px) {
      .tab-btn { font-size: 12px; padding: 8px 6px; }
      .btn-save, .btn-clear { padding: 6px 10px; font-size: 12px; }
    }
  </style>
  <script type="module" crossorigin src="/assets/studyTools-B2Q--cGz.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/Navbar-BhB1VpnS.js">
  <link rel="stylesheet" crossorigin href="/assets/Navbar-B3efO0hj.css">
  <link rel="stylesheet" crossorigin href="/assets/design-tokens-9MHcvJ5I.css">
</head>
<body>
<div id="navbar-root"></div>
<div id="app">
  <main>
    <div class="tabs">
      <button class="tab-btn" :class="{active: tab==='notebook'}" @click="tab='notebook'">📝 ملاحظاتي</button>
      <button class="tab-btn" :class="{active: tab==='whiteboard'}" @click="tab='whiteboard'; initCanvas()">🎨 السبورة</button>
    </div>

    <!-- NOTEBOOK -->
    <div v-if="tab==='notebook'" class="notebook-layout">
      <div class="subject-sidebar">
        <div v-for="year in curriculum" :key="year.name" class="year-group">
          <div class="year-header" :class="{open: openYears[year.name]}" @click="toggleYear(year.name)">
            <span>{{ year.icon }} {{ year.name }}</span>
            <span class="arrow">▶</span>
          </div>
          <div v-if="openYears[year.name]">
            <div v-for="sem in year.semesters" :key="sem.name" class="semester-group">
              <div class="semester-label">{{ sem.name }}</div>
              <div v-for="subject in sem.subjects" :key="subject"
                class="subject-item"
                :class="{ active: currentSubject===subject, 'has-note': notes[subject] && notes[subject].trim() }"
                @click="selectSubject(subject)">
                <span class="dot"></span>{{ subject }}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="note-area">
        <template v-if="currentSubject">
          <div class="note-header">
            <span class="note-subject-name">{{ currentSubject }}</span>
            <div class="note-actions">
              <span class="note-meta" v-if="lastSaved[currentSubject]">حُفظ {{ lastSaved[currentSubject] }}</span>
              <button class="btn-clear" @click="clearNote">مسح</button>
              <button class="btn-save" :class="{saved: justSaved}" @click="saveNote">{{ justSaved ? '✓ تم الحفظ' : 'حفظ' }}</button>
            </div>
          </div>
          <div class="note-toolbar">
            <button class="tool-btn" @click="formatText('**','**')"><b>B</b></button>
            <button class="tool-btn" @click="formatText('*','*')"><i>I</i></button>
            <button class="tool-btn" @click="insertLine('## ')">H</button>
            <button class="tool-btn" @click="insertLine('- ')">•</button>
            <button class="tool-btn" @click="insertLine('1. ')">1.</button>
            <button class="tool-btn" @click="insertLine('> ')">❝</button>
            <button class="tool-btn" @click="formatText('`','`')">{ }</button>
            <button class="tool-btn" @click="insertLine('---\n')">—</button>
          </div>
          <textarea id="noteEditor" class="note-editor"
            v-model="notes[currentSubject]"
            placeholder="اكتب ملاحظاتك هنا... (Ctrl+S للحفظ)"
            @input="autoSave"
            @keydown.ctrl.s.prevent="saveNote">
          </textarea>
        </template>
        <div v-else class="note-empty">
          <div class="icon">📚</div>
          <p>اختار سنة ← فصل ← مادة من القائمة الجانبية</p>
        </div>
      </div>
    </div>

    <!-- WHITEBOARD -->
    <div v-if="tab==='whiteboard'" class="wb-container">

      <!-- Pages bar -->
      <div class="wb-pages-bar">
        <div v-for="(page, idx) in wbPages" :key="page.id"
          class="page-tab" :class="{active: currentPage===idx}"
          @click="switchPage(idx)">
          📄 {{ page.name }}
          <button class="del-page" v-if="wbPages.length > 1" @click.stop="deletePage(idx)">✕</button>
        </div>
        <button class="add-page-btn" @click="addPage" title="صفحة جديدة">+</button>
      </div>

      <!-- Toolbar -->
      <div class="wb-toolbar">
        <div class="wb-toolbar-group">
          <span class="wb-label">الأداة</span>
          <button class="wb-tool-btn" :class="{active: wbTool==='pen'}"    @click="wbTool = wbTool==='pen' ? null : 'pen'">✏️ قلم</button>
          <button class="wb-tool-btn" :class="{active: wbTool==='eraser'}" @click="wbTool = wbTool==='eraser' ? null : 'eraser'">🧹 ممحاة</button>
          <button class="wb-tool-btn" :class="{active: wbTool==='line'}"   @click="wbTool = wbTool==='line' ? null : 'line'">╱ خط</button>
          <button class="wb-tool-btn" :class="{active: wbTool==='rect'}"   @click="wbTool = wbTool==='rect' ? null : 'rect'">▭ مستطيل</button>
          <button class="wb-tool-btn" :class="{active: wbTool==='circle'}" @click="wbTool = wbTool==='circle' ? null : 'circle'">○ دائرة</button>
        </div>
        <div class="wb-toolbar-group">
          <span class="wb-label">صورة</span>
          <label class="wb-file-label">
            🖼️ رفع صورة
            <input type="file" accept="image/*" @change="loadImage" style="display:none"/>
          </label>
          <button class="wb-tool-btn" :class="{active: wbTool==='moveImg'}" v-if="hasImage" @click="wbTool = wbTool==='moveImg' ? null : 'moveImg'">🖐️ تحريك/تكبير</button>
          <button class="wb-tool-btn danger" v-if="hasImage" @click="removeImage">✕ إزالة</button>
        </div>
        <div class="wb-toolbar-group">
          <span class="wb-label">اللون</span>
          <div v-for="c in colors" :key="c" class="color-dot"
            :class="{active: wbColor===c}" :style="{background: c}"
            @click="wbColor=c; if(wbTool==='moveImg') wbTool='pen'"></div>
          <input type="color" v-model="wbColor"
            style="width:20px;height:20px;border:none;background:none;cursor:pointer;border-radius:50%;overflow:hidden"/>
        </div>
        <div class="wb-toolbar-group">
          <span class="wb-label">الحجم</span>
          <input type="range" min="1" max="30" v-model="wbSize" class="wb-slider"/>
          <span style="font-size:12px;color:var(--text-dim);min-width:18px">{{ wbSize }}</span>
        </div>
        <div class="wb-toolbar-group">
          <button class="wb-tool-btn" @click="undoWb">↩ تراجع</button>
          <button class="wb-tool-btn danger" @click="clearWb">🗑 مسح</button>
          <button class="wb-tool-btn" @click="saveWbImage">💾 تحميل</button>
        </div>
      </div>

      <!-- Scrollable canvas wrapper -->
      <div class="wb-scroll-wrapper">
        <!-- Canvas area -->
        <div class="wb-canvas-area"
          :class="['tool-'+wbTool, isDragging ? 'dragging' : '']"
          ref="canvasArea"
          @mousedown="startDraw" @mousemove="onMove" @mouseup="endDraw" @mouseleave="endDraw"
          @touchstart.prevent="onTouchStart" @touchmove="onTouchMove" @touchend.prevent="onTouchEnd"
          @wheel.prevent="onWheel">
          <!-- Overlay image (positioned via CSS transform) -->
          <img v-if="hasImage" ref="overlayImg" class="wb-overlay-img"
            :src="imgSrc"
            :style="imgStyle"
            draggable="false"/>
          <!-- Drawing canvas -->
          <canvas ref="wbCanvas"></canvas>
          <!-- Zoom badge shown only when image active -->
          <div class="zoom-badge" v-if="hasImage && wbTool==='moveImg'">
            {{ Math.round(imgScale*100) }}%
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const { createApp, ref, reactive, nextTick, computed, watch } = Vue;
createApp({
  setup() {
    const tab = ref('notebook');

    const curriculum = [
      { name: 'First Year', icon: '📘', semesters: [
        { name: 'Semester 1', subjects: ['Scientific Research Methodology','Introduction to Engineering','Engineering Drawing','Calculus A','General Physics Lab A','General Physics A'] },
        { name: 'Semester 2', subjects: ['General Chemistry','Workshop Technology','Introduction to Computers','Introduction to Computers Lab','Technical English','Calculus B','General Physics B'] }
      ]},
      { name: 'Second Year', icon: '📙', semesters: [
        { name: 'Semester 1', subjects: ['Computer Programming 1','Computer Programming Lab 1','Digital Design 1','Digital Design Lab 1','Electric Circuits 1','Electric Circuits Lab 1'] },
        { name: 'Semester 2', subjects: ['Linear Algebra','Computer Programming 2','Computer Programming Lab 2','Digital Design 2','Digital Design Lab 2','Electronics Lab 1','Electronics 1','Ordinary Differential Equations'] }
      ]},
      { name: 'Third Year', icon: '📕', semesters: [
        { name: 'Semester 1', subjects: ['Discrete Mathematics','Discrete Mathematics Lab','Data Structures and Algorithms','Data Structures and Algorithms Lab','Practical Linear Signals and Systems','Linear Signals and Systems','Probability and Statistics Theory'] },
        { name: 'Semester 2', subjects: ['Computer Architecture','Computer Architecture Lab','Database Systems','Database Systems Lab','Practical Digital Electronics','Digital Electronics','Linear Control Systems Practical','Linear Control Systems'] }
      ]},
      { name: 'Fourth Year', icon: '📒', semesters: [
        { name: 'Semester 1', subjects: ['Operating Systems','Operating Systems Lab','Data Communication','Data Communication Lab','Assembly Language','Assembly Language Lab','Practical Training 250h'] },
        { name: 'Semester 2', subjects: ['Computer Networks','Computer Networks Lab','Embedded Systems','Embedded Systems Lab','VHDL','VHDL Lab','Software Engineering'] }
      ]},
      { name: 'Fifth Year', icon: '📗', semesters: [
        { name: 'Semester 1', subjects: ['AI','Deep Learning','AI Lab','Network Security','Digital Image Processing','Network Security Lab'] },
        { name: 'Semester 2', subjects: ['Security In Computer Systems','Elective Course 3','Elective Course 4'] }
      ]}
    ];

    // NOTEBOOK
    const STORAGE_KEY = 'iug_notes_v2';
    const notes = reactive({});
    const lastSaved = reactive({});
    const currentSubject = ref(null);
    const justSaved = ref(false);
    const openYears = reactive({});
    let autoSaveTimer = null;

    curriculum.forEach(y => {
      openYears[y.name] = false;
      y.semesters.forEach(s => s.subjects.forEach(sub => { if (!notes[sub]) notes[sub] = ''; }));
    });

    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const p = JSON.parse(stored);
        Object.assign(notes, p.notes || {});
        Object.assign(lastSaved, p.lastSaved || {});
      }
    } catch(e) {}

    function toggleYear(name) { openYears[name] = !openYears[name]; }
    function selectSubject(s) { currentSubject.value = s; }

    function saveNote() {
      if (currentSubject.value) {
        lastSaved[currentSubject.value] = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ notes, lastSaved }));
      justSaved.value = true;
      setTimeout(() => justSaved.value = false, 2000);
    
    }

    function autoSave() { clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(saveNote, 1200); }

    function clearNote() {
      if (!currentSubject.value || !confirm('مسح ملاحظات ' + currentSubject.value + '؟')) return;
      notes[currentSubject.value] = ''; saveNote();
    }

    function formatText(before, after) {
      const ta = document.getElementById('noteEditor');
      if (!ta) return;
      const s = ta.selectionStart, e = ta.selectionEnd;
      const sel = notes[currentSubject.value].substring(s, e) || 'نص';
      notes[currentSubject.value] = notes[currentSubject.value].substring(0,s) + before + sel + after + notes[currentSubject.value].substring(e);
      nextTick(() => { ta.focus(); ta.setSelectionRange(s+before.length, s+before.length+sel.length); });
    }

    function insertLine(prefix) {
      const ta = document.getElementById('noteEditor');
      if (!ta) return;
      const pos = ta.selectionStart, text = notes[currentSubject.value];
      const ls = text.lastIndexOf('\n', pos-1) + 1;
      notes[currentSubject.value] = text.substring(0,ls) + prefix + text.substring(ls);
      nextTick(() => { ta.focus(); ta.setSelectionRange(ls+prefix.length, ls+prefix.length); });
    }

    // ══ WHITEBOARD ══
    const wbCanvas   = ref(null);
    const canvasArea = ref(null);
    const wbTool     = ref(null);
    const wbColor    = ref('#00e5ff');
    const wbSize     = ref(3);
    const colors     = ['#00e5ff','#ffffff','#ff4757','#2ed573','#ffa502','#a29bfe','#fd79a8','#000000'];
    const isDragging = ref(false);

    // Pages
    const WB_STORAGE  = 'iug_wb_pages_v3';
    const wbPages     = reactive([]);
    const currentPage = ref(0);
    function defaultPage(n) {
      return { id: Date.now()+n, name:'صفحة '+(n+1), drawing:null, imgSrc:null, imgX:0, imgY:0, imgScale:1 };
    }
    try {
      const sv = JSON.parse(localStorage.getItem(WB_STORAGE));
      if (sv && sv.length) sv.forEach(p => wbPages.push(p));
    } catch(e){}
    if (!wbPages.length) wbPages.push(defaultPage(0));

    // Image overlay state (reactive so template updates)
    const hasImage = ref(false);
    const imgSrc   = ref('');
    const imgX     = ref(0);
    const imgY     = ref(0);
    const imgScale = ref(1);
    const imgStyle = computed(() =>
      `transform: translate(${imgX.value}px, ${imgY.value}px) scale(${imgScale.value})`
    );

    function syncImgFromPage() {
      const p = wbPages[currentPage.value];
      hasImage.value  = !!p.imgSrc;
      imgSrc.value    = p.imgSrc || '';
      imgX.value      = p.imgX   || 0;
      imgY.value      = p.imgY   || 0;
      imgScale.value  = p.imgScale || 1;
    }
    function syncImgToPage() {
      const p = wbPages[currentPage.value];
      p.imgSrc   = imgSrc.value;
      p.imgX     = imgX.value;
      p.imgY     = imgY.value;
      p.imgScale = imgScale.value;
    }

    // Canvas / drawing
    let ctx = null;
    let drawing = false;
    let lastX=0, lastY=0, startX=0, startY=0;
    let snapshot = null;
    const undoStack = [];

    function savePagesToStorage() {
      try { localStorage.setItem(WB_STORAGE, JSON.stringify(wbPages.map(p=>({...p})))); } catch(e){}
    }
    function saveCurrentDrawing() {
      if (!ctx || !wbCanvas.value) return;
      wbPages[currentPage.value].drawing = wbCanvas.value.toDataURL();
      syncImgToPage();
      savePagesToStorage();
    }
    function loadPageOnCanvas() {
      if (!ctx || !wbCanvas.value) return;
      syncImgFromPage();
      ctx.clearRect(0,0,wbCanvas.value.width,wbCanvas.value.height);
      const d = wbPages[currentPage.value].drawing;
      if (d) { const i=new Image(); i.onload=()=>ctx.drawImage(i,0,0); i.src=d; }
    }

    const CANVAS_HEIGHT = 1600; // tall scrollable canvas

    // When a tool is active → block scroll on canvas so touch draws
    // When no tool → allow scroll freely
    watch(wbTool, (tool) => {
      if (wbCanvas.value) {
        wbCanvas.value.style.touchAction = tool ? 'none' : 'auto';
      }
    });

    function initCanvas() {
      nextTick(() => {
        const canvas = wbCanvas.value, area = canvasArea.value;
        if (!canvas || !area) return;
        ctx = canvas.getContext('2d');
        canvas.width  = area.clientWidth  || 900;
        canvas.height = CANVAS_HEIGHT;
        undoStack.length = 0;
        loadPageOnCanvas();
      });
    }

    // Re-init canvas on resize (width may change, height stays tall)
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (wbCanvas.value && canvasArea.value) {
          saveCurrentDrawing();
          const canvas = wbCanvas.value;
          canvas.width  = canvasArea.value.clientWidth;
          canvas.height = CANVAS_HEIGHT;
          undoStack.length = 0;
          loadPageOnCanvas();
        }
      }, 250);
    });

    function switchPage(idx) {
      saveCurrentDrawing(); currentPage.value = idx;
      undoStack.length = 0;
      nextTick(loadPageOnCanvas);
    }
    function addPage() {
      saveCurrentDrawing();
      wbPages.push(defaultPage(wbPages.length));
      currentPage.value = wbPages.length - 1;
      undoStack.length = 0;
      nextTick(() => {
        if (ctx && wbCanvas.value) ctx.clearRect(0,0,wbCanvas.value.width,wbCanvas.value.height);
        hasImage.value = false; imgSrc.value = '';
      });
    }
    function deletePage(idx) {
      if (wbPages.length<=1 || !confirm('حذف '+wbPages[idx].name+'؟')) return;
      wbPages.splice(idx,1);
      if (currentPage.value >= wbPages.length) currentPage.value = wbPages.length-1;
      savePagesToStorage();
      nextTick(() => { undoStack.length=0; loadPageOnCanvas(); });
    }

    // ── Drawing helpers ──
    function getPos(e) {
      const c=wbCanvas.value, r=c.getBoundingClientRect();
      return { x:(e.clientX-r.left)*(c.width/r.width), y:(e.clientY-r.top)*(c.height/r.height) };
    }
    function pushUndo() {
      undoStack.push(ctx.getImageData(0,0,wbCanvas.value.width,wbCanvas.value.height));
      if (undoStack.length>40) undoStack.shift();
    }
    function applyDraw(x,y) {
      ctx.lineWidth   = wbTool.value==='eraser' ? wbSize.value*5 : Number(wbSize.value);
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.strokeStyle = wbTool.value==='eraser' ? '#0a1a24' : wbColor.value;
      if (wbTool.value==='pen'||wbTool.value==='eraser') {
        ctx.lineTo(x,y); ctx.stroke(); lastX=x; lastY=y;
      } else {
        ctx.putImageData(snapshot,0,0); ctx.beginPath();
        if (wbTool.value==='line') { ctx.moveTo(startX,startY); ctx.lineTo(x,y); ctx.stroke(); }
        else if (wbTool.value==='rect') { ctx.strokeRect(startX,startY,x-startX,y-startY); }
        else if (wbTool.value==='circle') {
          const rx=Math.abs(x-startX)/2, ry=Math.abs(y-startY)/2;
          ctx.ellipse(startX+(x-startX)/2, startY+(y-startY)/2, rx,ry,0,0,Math.PI*2); ctx.stroke();
        }
      }
    }

    // ── Mouse events ──
    function startDraw(e) {
      if (!ctx || !wbTool.value) return;
      const {x,y} = getPos(e);
      if (wbTool.value==='moveImg' && hasImage.value) {
        isDragging.value=true; lastX=e.clientX; lastY=e.clientY; return;
      }
      pushUndo(); drawing=true; lastX=startX=x; lastY=startY=y;
      if (['line','rect','circle'].includes(wbTool.value))
        snapshot=ctx.getImageData(0,0,wbCanvas.value.width,wbCanvas.value.height);
      if (wbTool.value==='pen'||wbTool.value==='eraser') { ctx.beginPath(); ctx.moveTo(x,y); }
    }
    function onMove(e) {
      if (!ctx) return;
      if (wbTool.value==='moveImg' && isDragging.value) {
        imgX.value += e.clientX - lastX;
        imgY.value += e.clientY - lastY;
        lastX=e.clientX; lastY=e.clientY; return;
      }
      if (!drawing) return;
      applyDraw(...Object.values(getPos(e)));
    }
    function endDraw() {
      isDragging.value=false;
      if (drawing) { drawing=false; ctx.closePath(); saveCurrentDrawing(); }
    }

    // ── Wheel zoom for image ──
    function onWheel(e) {
      if (!hasImage.value || wbTool.value!=='moveImg') return;
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      imgScale.value = Math.min(8, Math.max(0.1, imgScale.value * delta));
    }

    // ── Touch events (draw + pinch zoom) ──
    let touch1=null, touch2=null, initPinchDist=0, initScale=1;

    function onTouchStart(e) {
      if (e.touches.length===2) {
        // Pinch start
        touch1=e.touches[0]; touch2=e.touches[1];
        initPinchDist = Math.hypot(touch2.clientX-touch1.clientX, touch2.clientY-touch1.clientY);
        initScale = imgScale.value;
        return;
      }
      const t=e.touches[0];
      startDraw({clientX:t.clientX, clientY:t.clientY});
    }
    function onTouchMove(e) {
      if (wbTool.value) e.preventDefault();
      if (e.touches.length===2 && hasImage.value) {
        // Pinch zoom
        const t1=e.touches[0], t2=e.touches[1];
        const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
        imgScale.value = Math.min(8, Math.max(0.1, initScale*(dist/initPinchDist)));
        // Pan: midpoint delta
        const mx=(t1.clientX+t2.clientX)/2, my=(t1.clientY+t2.clientY)/2;
        const om=(touch1.clientX+touch2.clientX)/2, omy=(touch1.clientY+touch2.clientY)/2;
        imgX.value += mx-om; imgY.value += my-omy;
        touch1=t1; touch2=t2;
        return;
      }
      const t=e.touches[0];
      if (wbTool.value==='moveImg' && isDragging.value) {
        imgX.value += t.clientX - lastX; imgY.value += t.clientY - lastY;
        lastX=t.clientX; lastY=t.clientY; return;
      }
      if (!drawing) return;
      const c=wbCanvas.value, r=c.getBoundingClientRect();
      applyDraw((t.clientX-r.left)*(c.width/r.width), (t.clientY-r.top)*(c.height/r.height));
    }
    function onTouchEnd(e) {
      touch2=null;
      if (e.touches.length===0) { endDraw(); syncImgToPage(); savePagesToStorage(); }
    }

    // ── Image actions ──
    function loadImage(event) {
      const file=event.target.files[0]; if (!file) return;
      event.target.value='';
      const reader=new FileReader();
      reader.onload = ev => {
        imgSrc.value   = ev.target.result;
        imgX.value     = 20; imgY.value=20; imgScale.value=1;
        hasImage.value = true;
        // Don't auto-switch tool — user picks manually
        syncImgToPage(); savePagesToStorage();
      };
      reader.readAsDataURL(file);
    }
    function removeImage() {
      imgSrc.value=''; hasImage.value=false;
      imgX.value=0; imgY.value=0; imgScale.value=1;
      syncImgToPage(); savePagesToStorage();
    }

    // ── Undo / Clear / Save ──
    function undoWb() {
      if (!undoStack.length||!ctx) return;
      ctx.putImageData(undoStack.pop(),0,0); saveCurrentDrawing();
    }
    function clearWb() {
      if (!ctx||!confirm('مسح هذه الصفحة؟')) return;
      ctx.clearRect(0,0,wbCanvas.value.width,wbCanvas.value.height);
      wbPages[currentPage.value].drawing=null;
      removeImage();
    }
    function saveWbImage() {
      // Composite: create off-screen canvas with image + drawing
      const c = wbCanvas.value;
      const out = document.createElement('canvas');
      out.width=c.width; out.height=c.height;
      const octx = out.getContext('2d');
      octx.fillStyle='#0a1a24'; octx.fillRect(0,0,out.width,out.height);
      if (hasImage.value) {
        const img=new Image();
        img.onload=()=>{
          octx.drawImage(img, imgX.value, imgY.value, img.width*imgScale.value, img.height*imgScale.value);
          octx.drawImage(c,0,0);
          const a=document.createElement('a'); a.download='whiteboard-p'+(currentPage.value+1)+'.png'; a.href=out.toDataURL(); a.click();
        }; img.src=imgSrc.value;
      } else {
        octx.drawImage(c,0,0);
        const a=document.createElement('a'); a.download='whiteboard-p'+(currentPage.value+1)+'.png'; a.href=out.toDataURL(); a.click();
      }
    }

    return {
      tab, curriculum, notes, lastSaved, currentSubject, justSaved, openYears,
      toggleYear, selectSubject, saveNote, autoSave, clearNote, formatText, insertLine,
      wbCanvas, canvasArea, wbTool, wbColor, wbSize, colors, isDragging,
      wbPages, currentPage, hasImage, imgSrc, imgX, imgY, imgScale, imgStyle,
      initCanvas, switchPage, addPage, deletePage,
      startDraw, onMove, endDraw, onTouchStart, onTouchMove, onTouchEnd, onWheel,
      loadImage, removeImage, undoWb, clearWb, saveWbImage,
    };
  }
}).mount('#app');
</script>
</body>
</html>
